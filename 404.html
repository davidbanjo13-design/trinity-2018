<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Not found — Trinity 2018 Reunion</title>
<meta name="theme-color" content="#07080B" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2307080B'/><text y='70' x='50' text-anchor='middle' font-family='Georgia,serif' font-size='52' fill='%23E9B949'>T</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="styles.css" />
<style>
  .nf {
    min-height: 100svh;
    display: grid;
    align-content: center;
    justify-items: start;
    gap: 1.25rem;
    max-width: 38rem;
    margin: 0 auto;
    padding: 0 var(--page);
    position: relative;
  }
  .nf__ghost {
    position: absolute;
    right: -2%;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--display);
    font-size: clamp(11rem, 38vw, 24rem);
    line-height: .8;
    color: rgba(255,255,255,.025);
    letter-spacing: -.04em;
    pointer-events: none;
  }
  .nf > * { position: relative; z-index: 1; }
  .nf h1 { font-family: var(--display); font-size: clamp(2.2rem, 8vw, 3.6rem); line-height: 1.05; color: #fff; }
  .nf p { color: var(--muted); line-height: 1.7; }
</style>
</head>
<body>

<main class="nf">
  <span class="nf__ghost" aria-hidden="true">404</span>
  <p class="eyebrow">Wrong turn</p>
  <h1>There's nothing here.</h1>
  <p>
    Which is fitting, because for eight years there was nothing anywhere.
    The reunion is this way.
  </p>
  <a class="btn btn--primary" href="/">Take me to the reunion</a>
</main>

</body>
</html>
